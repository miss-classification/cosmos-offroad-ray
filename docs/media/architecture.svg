<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="Helvetica, Arial, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <style>
      .box  { fill:#fff; stroke:#111; stroke-width:2; }
      .tag  { fill:#1f5fd6; }
      .tagt { font-size:12px; font-weight:700; letter-spacing:.06em; fill:#fff; }
      .h    { font-size:17px; font-weight:700; fill:#111; }
      .t    { font-size:14px; fill:#333; }
      .c    { font-size:14px; fill:#333; font-family: Menlo, Consolas, 'Courier New', monospace; }
      .lane { font-size:13px; font-weight:700; letter-spacing:.12em; fill:#111; }
      .e    { stroke:#111; stroke-width:2; fill:none; }
      .d    { stroke:#111; stroke-width:2; fill:none; stroke-dasharray:6 5; }
    </style>
  </defs>

  <rect width="1280" height="600" fill="#fff"/>

  <!-- title -->
  <text x="640" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#111">Off-Road Video Augmentation on Ray</text>
  <text x="640" y="76" text-anchor="middle" font-size="15" fill="#444">Ray Data · Ray Core · Ray Serve · NVIDIA Cosmos Transfer 2.5</text>

  <!-- lanes -->
  <text class="lane" x="24" y="122">BATCH PIPELINE</text>
  <text class="lane" x="24" y="392">INTERACTIVE APPLICATION</text>
  <line x1="24" y1="362" x2="1040" y2="362" stroke="#bbb" stroke-width="1.5"/>

  <!-- row 1 -->
  <rect class="box" x="24" y="140" width="164" height="130" rx="8"/>
  <text class="h" x="106" y="192" text-anchor="middle">TartanDrive 2.0</text>
  <text class="t" x="106" y="218" text-anchor="middle">9 real ATV drives</text>
  <text class="t" x="106" y="240" text-anchor="middle">CC BY 4.0</text>

  <rect class="box" x="214" y="140" width="190" height="130" rx="8"/>
  <path class="tag" d="M222,140 h174 a8,8 0 0 1 8,8 v20 h-190 v-20 a8,8 0 0 1 8,-8 z"/>
  <text class="tagt" x="309" y="159" text-anchor="middle">RAY DATA</text>
  <text class="h" x="309" y="202" text-anchor="middle">Clip preparation</text>
  <text class="t" x="309" y="228" text-anchor="middle">resample to 16 fps</text>
  <text class="t" x="309" y="250" text-anchor="middle">edge maps, cached</text>

  <path class="box" d="M438,154 a75,13 0 0,1 150,0 v102 a75,13 0 0,1 -150,0 z"/>
  <path class="e" d="M438,154 a75,13 0 0,0 150,0"/>
  <text class="h" x="513" y="208" text-anchor="middle">Clip catalog</text>
  <text class="t" x="513" y="234" text-anchor="middle">clip + edge map</text>

  <rect class="box" x="622" y="140" width="180" height="130" rx="8"/>
  <path class="tag" d="M630,140 h164 a8,8 0 0 1 8,8 v20 h-180 v-20 a8,8 0 0 1 8,-8 z"/>
  <text class="tagt" x="712" y="159" text-anchor="middle">RAY CORE</text>
  <text class="h" x="712" y="202" text-anchor="middle">Scheduler</text>
  <text class="c" x="712" y="228" text-anchor="middle">ray.wait</text>
  <text class="t" x="712" y="250" text-anchor="middle">retry and resume</text>

  <rect class="box" x="852" y="128" width="190" height="130" rx="8"/>
  <rect class="box" x="844" y="134" width="190" height="130" rx="8"/>
  <rect class="box" x="836" y="140" width="190" height="130" rx="8"/>
  <path class="tag" d="M844,140 h174 a8,8 0 0 1 8,8 v20 h-190 v-20 a8,8 0 0 1 8,-8 z"/>
  <text class="tagt" x="931" y="159" text-anchor="middle">RAY CORE</text>
  <text class="h" x="931" y="202" text-anchor="middle">CosmosActor × 8</text>
  <text class="t" x="931" y="228" text-anchor="middle">1 GPU each</text>
  <text class="t" x="931" y="250" text-anchor="middle">model loaded once</text>

  <rect class="box" x="1080" y="140" width="170" height="130" rx="8"/>
  <text class="h" x="1165" y="192" text-anchor="middle">Outputs</text>
  <text class="t" x="1165" y="218" text-anchor="middle">validated MP4s</text>
  <text class="t" x="1165" y="240" text-anchor="middle">guardrails on</text>

  <!-- scoring (batch, under outputs) -->
  <rect class="box" x="1080" y="420" width="170" height="130" rx="8"/>
  <path class="tag" d="M1088,420 h154 a8,8 0 0 1 8,8 v20 h-170 v-20 a8,8 0 0 1 8,-8 z"/>
  <text class="tagt" x="1165" y="439" text-anchor="middle">RAY DATA</text>
  <text class="h" x="1165" y="482" text-anchor="middle">Quality scoring</text>
  <text class="t" x="1165" y="508" text-anchor="middle">edge F1, chroma</text>
  <text class="t" x="1165" y="530" text-anchor="middle">VLM judge</text>

  <!-- row 2: interactive -->
  <rect class="box" x="24" y="420" width="164" height="130" rx="8"/>
  <text class="h" x="106" y="472" text-anchor="middle">Browser</text>
  <text class="t" x="106" y="498" text-anchor="middle">drive + weather</text>
  <text class="t" x="106" y="520" text-anchor="middle">prompt</text>

  <rect class="box" x="214" y="420" width="588" height="130" rx="8"/>
  <path class="tag" d="M222,420 h572 a8,8 0 0 1 8,8 v20 h-588 v-20 a8,8 0 0 1 8,-8 z"/>
  <text class="tagt" x="508" y="439" text-anchor="middle">RAY SERVE</text>
  <text class="h" x="508" y="482" text-anchor="middle">PaintAPI</text>
  <text class="t" x="508" y="508" text-anchor="middle">FastAPI ingress, job status per GPU</text>
  <text class="t" x="508" y="530" text-anchor="middle">routes each request by scene</text>

  <rect class="box" x="836" y="420" width="190" height="130" rx="8"/>
  <path class="tag" d="M844,420 h174 a8,8 0 0 1 8,8 v20 h-190 v-20 a8,8 0 0 1 8,-8 z"/>
  <text class="tagt" x="931" y="439" text-anchor="middle">RAY SERVE</text>
  <text class="h" x="931" y="482" text-anchor="middle">Painter × 8</text>
  <text class="c" x="931" y="508" text-anchor="middle">@serve.multiplexed</text>
  <text class="t" x="931" y="530" text-anchor="middle">reuses CosmosActor</text>

  <!-- arrows -->
  <path class="e" d="M188,205 H212" marker-end="url(#a)"/>
  <path class="e" d="M404,205 H436" marker-end="url(#a)"/>
  <path class="e" d="M588,205 H620" marker-end="url(#a)"/>
  <path class="e" d="M802,205 H834" marker-end="url(#a)"/>
  <path class="e" d="M1042,205 H1078" marker-end="url(#a)"/>
  <path class="e" d="M1165,270 V418" marker-end="url(#a)"/>
  <path class="e" d="M188,485 H212" marker-end="url(#a)"/>
  <path class="e" d="M802,485 H834" marker-end="url(#a)"/>
  <path class="d" d="M931,418 V274" marker-end="url(#a)"/>
</svg>
